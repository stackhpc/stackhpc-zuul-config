---
- name: Ensure Zuul is configured
  gather_facts: false
  hosts: localhost

  tasks:
    - name: Ensure Zuul namespace
      kubernetes.core.k8s:
        name: zuul
        api_version: v1
        kind: Namespace
        state: present

    - name: Ensure cert-manager
      kubernetes.core.k8s:
        src: "{{ zuul_cert_manager_url }}"
        state: present
      tags: cert-manager

    - name: Wait for cert-manager webhook
      kubernetes.core.k8s_info:
        kind: Deployment
        name: cert-manager-webhook
        namespace: cert-manager
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 300
      when: not ansible_check_mode
      tags: cert-manager

    - name: Ensure PXC CRDs
      kubernetes.core.k8s:
        namespace: zuul
        src: "{{ zuul_operator_pxc_crd_url }}"
        state: present
      when: zuul_operator_pxc_crd_url | length > 0
      tags: pxc

    - name: Ensure PXC bundle
      kubernetes.core.k8s:
        namespace: "zuul"
        src: "{{ zuul_operator_pxc_bundle_url }}"
        state: present
      when: zuul_operator_pxc_bundle_url | length > 0
      tags: pxc

    - name: Ensure Secrets
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          type: "{{ item.type | default('Opaque') }}"
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ item.namespace | default('zuul') }}"
          data: "{{ item.data }}"
        state: present
      loop: "{{ zuul_operator_secrets + zuul_external_secrets }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Ensure ZooKeeper CA
      kubernetes.core.k8s:
        definition: "{{ zuul_zookeeper_ca }}"
        namespace: "zuul"
        state: present
      tags: zookeeper

    - name: Ensure ZooKeeper
      kubernetes.core.k8s:
        definition: "{{ zuul_zookeeper }}"
        namespace: "zuul"
        state: present
        wait: true
        wait_timeout: 600
      tags: zookeeper

    - name: Ensure PXC cluster
      kubernetes.core.k8s:
        definition: "{{ zuul_pxc_cluster }}"
        namespace: "zuul"
        state: present
      tags: pxc

    - name: Wait for PXC cluster
      kubernetes.core.k8s_info:
        api_version: pxc.percona.com/v1
        kind: PerconaXtraDBCluster
        name: db-cluster
        namespace: zuul
      register: zuul_pxc_status
      until: >-
        zuul_pxc_status.resources | length > 0 and
        zuul_pxc_status.resources[0].status.state | default('') == 'ready'
      retries: 60
      delay: 10
      when: not ansible_check_mode
      tags: pxc

    - name: Ensure CRDs
      kubernetes.core.k8s:
        namespace: "zuul"
        src: "{{ zuul_operator_crd_url }}"
        state: present

    - name: Ensure RBAC
      kubernetes.core.k8s:
        namespace: "zuul"
        definition: "{{ zuul_operator_rbac }}"
        state: present

    - name: Ensure Operator
      kubernetes.core.k8s:
        definition: "{{ zuul_operator_operator }}"
        namespace: "zuul"
        state: present

    - name: Ensure additional config
      kubernetes.core.k8s:
        definition: "{{ item }}"
        namespace: "zuul"
        state: present
      loop: "{{ zuul_operator_additional }}"

    - name: Ensure Zuul CR
      kubernetes.core.k8s:
        definition: "{{ zuul_operator_cr }}"
        namespace: "zuul"
        state: present
      tags: zuul-cr

    - name: Ensure Contour namespace
      kubernetes.core.k8s:
        name: projectcontour
        api_version: v1
        kind: Namespace
        state: present

    - name: Ensure Cert Manager issuers
      kubernetes.core.k8s:
        definition:
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ item.namespace | default('projectcontour') }}"
          spec: "{{ item.spec }}"
        state: present
      loop: "{{ zuul_operator_cert_manager_issuers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure Contour Provisioner CRDs
      kubernetes.core.k8s:
        src: "{{ zuul_operator_contour_provisioner_crd_url }}"
        state: present

    - name: Ensure Gateway API CRDs
      kubernetes.core.k8s:
        namespace: "zuul"
        src: "{{ zuul_operator_gateway_api_crd_url }}"
        state: present
      when: zuul_operator_gateway_api_crd_url | length > 0
      tags: gateway-api

    - name: Ensure Gateway API GatewayClasses
      kubernetes.core.k8s:
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: "{{ item.name }}"
          spec: "{{ item.spec }}"
      loop: "{{ zuul_operator_gateway_api_gatewayclasses }}"
      loop_control:
        label: "{{ item.name }}"
      tags: gateway-api

    - name: Ensure Gateway API Gateways
      kubernetes.core.k8s:
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: "{{ item.name }}"
          spec: "{{ item.spec }}"
        namespace: "projectcontour"
        state: present
      loop: "{{ zuul_operator_gateway_api_gateways }}"
      loop_control:
        label: "{{ item.name }}"
      tags: gateway-api

    - name: Ensure Gateway API HTTPRoutes
      kubernetes.core.k8s:
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: "{{ item.name }}"
          spec: "{{ item.spec }}"
        namespace: "zuul"
        state: present
      loop: "{{ zuul_operator_gateway_api_httproutes }}"
      loop_control:
        label: "{{ item.name }}"
      tags: gateway-api
