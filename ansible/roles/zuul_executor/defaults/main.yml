---
# Private SSH key the executor uses to log in to test nodes. Required.
# zuul_executor_ssh_key:

# On stop the executor takes no new builds and waits for running ones to
# finish (sigterm_method=graceful). After this many seconds, any builds
# still running are killed and Zuul retries them. A job's timeout only
# covers pre-run and run; post-run playbooks each get post-timeout on top.
# The longest jobs have a 3 hour timeout and the base job's post-timeout
# is 30 minutes, so allow 4 hours.
zuul_executor_stop_timeout: 14400
