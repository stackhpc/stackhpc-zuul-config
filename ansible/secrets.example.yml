---
# Variables expected in ansible/inventory/group_vars/all/secrets (vault
# encrypted). Most map to a Secret the zuul-operator deployment used:
#
#   ansible-vault edit ansible/inventory/group_vars/all/secrets

# ZooKeeper CA, generated with ansible/ca.yml.
zuul_zk_ca_key: |
  -----BEGIN PRIVATE KEY-----
  ...
zuul_zk_ca_cert: |
  -----BEGIN CERTIFICATE-----
  ...

# Encrypts project secret keys in ZooKeeper. It MUST be the password the
# current deployment uses (operator Secret zuul-keystore), or the keys
# exported from it cannot be imported.
zuul_keystore_password: ""

# Letters and digits only: they are embedded in the database URI in
# zuul.conf.
zuul_db_password: ""
zuul_db_root_password: ""

# GitHub app (operator Secret zuul-github).
zuul_github_app_id: ""
zuul_github_app_key: |
  -----BEGIN RSA PRIVATE KEY-----
  ...
zuul_github_webhook_token: ""

# Private key the executors use to log in to test nodes (operator Secret
# zuul-sshkey).
zuul_executor_ssh_key: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  ...

# Public keys added to the zuul user on test nodes by Nodepool userdata
# (previously zuul_operator_nodepool_ssh_authorized_keys).
nodepool_ssh_authorized_keys:
  - ssh-ed25519 AAAA... zuul@stackhpc-ci

# smslab application credential (previously
# zuul_operator_clouds_yaml_appcred_id/secret).
zuul_clouds_appcred_id: ""
zuul_clouds_appcred_secret: ""
