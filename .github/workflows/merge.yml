---
name: Apply Zuul configuration

on:
  workflow_dispatch:
  # Enable once the podman deployment has replaced the Kubernetes one.
  # push:
  #   branches:
  #     - master

permissions:
  contents: read

concurrency:
  group: deploy-zuul

jobs:
  deploy-zuul:

    # Self-hosted runner on the Zuul VM; see README.md.
    runs-on: [self-hosted, zuul-deploy]
    environment: production

    env:
      ANSIBLE_FORCE_COLOR: true

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install collections
      run: ansible-galaxy collection install -r ansible/requirements.yml

    - name: Run playbook
      env:
        ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      run: |
        vault_file="$RUNNER_TEMP/vault.txt"
        trap 'rm -f "$vault_file"' EXIT
        printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$vault_file"
        ansible-playbook -i ansible/inventory ansible/site.yml --vault-password-file "$vault_file"
